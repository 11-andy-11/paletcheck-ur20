<!doctype html>
<html lang="ro">
<head><meta charset="utf-8"><title>Bake AR</title></head>
<body>
<div id="c" style="width:400px;height:300px"></div>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
import { CellScene } from '../scene.js';
import { GLTFExporter } from './GLTFExporter.js';
import { USDZExporter } from './USDZExporter.js';

const toB64 = (buf) => {
  const bytes = new Uint8Array(buf);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
try {
  const sc = new CellScene(document.getElementById('c'));
  sc.setParams({ kg: 13, diameter: 30, height: 32, handle: true, ppm: 6.5 });
  const { root, size } = sc.buildExportGroup();
  // USDZ acceptă doar materiale standard
  root.traverse((o) => {
    if (o.isMesh && !o.material.isMeshStandardMaterial) {
      o.material = new THREE.MeshStandardMaterial({ color: o.material.color, emissive: o.material.color, emissiveIntensity: 0.6, roughness: 0.5 });
    }
  });
  root.updateMatrixWorld(true);
  const glb = await new GLTFExporter().parseAsync(root, { binary: true });
  const usdz = await new USDZExporter().parse(root);
  window.RESULT = { glb: toB64(glb), usdz: toB64(usdz), size: { x: size.x, y: size.y, z: size.z } };
} catch (e) {
  window.RESULT = { error: String(e && e.stack || e) };
}
</script>
</body>
</html>
